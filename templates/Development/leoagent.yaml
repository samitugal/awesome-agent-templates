settings:
  reasoning_level: "recommended"
  reasoning_strategy: "react"
  memory_policy: "long-term"
  state_storage: "local"

hints:
  - "Tell it your goal in plain language; it auto-selects the right specialist mode and coordinates multi-step work."
  - "Finance outputs are educational only and are not financial or investment advice."
  - "It defaults to read-only for databases, systems, and production, and asks before any destructive or public action — review those prompts carefully."
  - "Always verify facts, figures, and citations against original sources before acting on them."
  - "This is a broad generalist; for a single narrow task a dedicated specialist agent may go slightly deeper."

